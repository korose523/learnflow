[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnflow-backend"
version = "1.0.0"
description = "LearnFlow - AI-driven gamified learning platform"
requires-python = ">=3.10"

[tool.coverage.run]
source = ["app"]
omit = ["app/main_hello.py", "app/main_minimal.py", "app/main_cloudbase.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
